services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dwth-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      
      # Listeners config:
      # - CLIENT (9092) is for host machine (external) connections using SASL_PLAINTEXT
      # - INTERNAL (9094) is for container-to-container (internal) connections using PLAINTEXT
      # - CONTROLLER (9093) is for controller connections using PLAINTEXT
      KAFKA_LISTENERS: 'CLIENT://:9092,INTERNAL://:9094,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'CLIENT://localhost:9092,INTERNAL://kafka:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CLIENT:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      
      # SASL Authentication Configuration (PLAIN)
      KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN'
      
      # JAAS Config for PLAIN mechanism
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="dwth_user" password="dwth_secure_password123" user_dwth_user="dwth_secure_password123";'
      
      # Required KRaft cluster ID
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Replication and ISR settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - dwth-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dwth-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=dwth-kafka-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
    networks:
      - dwth-network

  redis:
    image: redis:7.0-alpine
    container_name: dwth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dwth-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dwth-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - dwth-network

volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local

networks:
  dwth-network:
    name: dwth-network
    driver: bridge
